name: Export KMZ research reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/export_kmz_research.py'
      - '.github/workflows/export-kmz-research.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - run: python scripts/export_kmz_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmz-research-reference
          path: artifacts/kmz-reference.geojson
          retention-days: 1
          if-no-files-found: error
