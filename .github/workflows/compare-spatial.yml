name: Monteria spatial comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/compare_spatial.py'
      - '.github/workflows/compare-spatial.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3' 'pyproj>=3.7,<4'
      - run: python -m py_compile scripts/compare_spatial.py
      - run: python scripts/compare_spatial.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-comparison
          path: artifacts/spatial-comparison.json
          if-no-files-found: error
          retention-days: 7
