name: Monteria stop procurement research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_stop_procurement.py'
      - '.github/workflows/probe-stop-procurement.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m py_compile scripts/probe_stop_procurement.py
      - run: python scripts/probe_stop_procurement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stop-procurement
          path: artifacts/stop-procurement.json
          if-no-files-found: error
          retention-days: 14
