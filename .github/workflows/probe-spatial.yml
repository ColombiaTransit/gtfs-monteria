name: Monteria spatial sources probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_spatial.py'
      - '.github/workflows/probe-spatial.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/probe_spatial.py
      - run: python scripts/probe_spatial.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-probe
          path: artifacts/spatial-probe.json
          if-no-files-found: error
          retention-days: 7
